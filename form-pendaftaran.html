<!DOCTYPE html>
<html lang="id">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Siswa Baru</title>
    <style>
        /* CSS sederhana supaya form terlihat rapi */
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 20px; padding: 10px 25px; background: #2E6DB4; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #19345c; }
        .group-radio { display: flex; gap: 20px; margin-top: 5px; }
        .group-radio label { font-weight: normal; margin-top: 0; }
    </style>
</head>
<body>

    <h1>Form Pendaftaran Siswa Baru</h1>
    <p>SMK Telkom Malang - Tahun Pelajaran 2026/2027</p>
    <hr>

    <form action="#" method="POST">

        <!-- ===== IDENTITAS DIRI ===== -->
        <h2>A. Identitas Diri</h2>

        <label for="namaLengkap">Nama Lengkap: *</label>
        <input type="text" id="namaLengkap" name="nama_lengkap"
               placeholder="Tulis nama lengkap sesuai akta"
               required minlength="3" maxlength="100">

        <label for="nisn">NISN: *</label>
        <input type="text" id="nisn" name="nisn"
               placeholder="10 digit NISN"
               required pattern="[0-9]{10}"
               title="NISN harus 10 digit angka">

        <label>Jenis Kelamin: *</label>
        <div class="group-radio">
            <label><input type="radio" name="jenis_kelamin" value="L" required> Laki-laki</label>
            <label><input type="radio" name="jenis_kelamin" value="P"> Perempuan</label>
        </div>

        <label for="tglLahir">Tanggal Lahir: *</label>
        <input type="date" id="tglLahir" name="tgl_lahir" required>

        <label for="tempatLahir">Tempat Lahir:</label>
        <input type="text" id="tempatLahir" name="tempat_lahir" placeholder="Kota kelahiran">

        <!-- ===== KONTAK ===== -->
        <h2>B. Informasi Kontak</h2>

        <label for="email">Email Aktif: *</label>
        <input type="email" id="email" name="email"
               placeholder="email@contoh.com" required>

        <label for="noHp">Nomor HP / WhatsApp: *</label>
        <input type="tel" id="noHp" name="no_hp"
               placeholder="08xxxxxxxxxx" required>

        <label for="alamat">Alamat Lengkap: *</label>
        <textarea id="alamat" name="alamat" rows="3"
                  placeholder="Jalan, RT/RW, Desa/Kelurahan, Kecamatan, Kota"
                  required></textarea>

        <!-- ===== PILIHAN JURUSAN ===== -->
        <h2>C. Pilihan Program Keahlian</h2>

        <label for="jurusan">Pilihan Jurusan: *</label>
        <select id="jurusan" name="jurusan" required>
            <option value="">-- Pilih Jurusan --</option>
            <option value="rpl">Rekayasa Perangkat Lunak (RPL)</option>
            <option value="tkj">Teknik Komputer & Jaringan (TKJ)</option>
            <option value="mm">Multimedia (MM)</option>
            <option value="akl">Akuntansi & Keuangan Lembaga (AKL)</option>
        </select>

        <label>Hobi / Minat: (boleh lebih dari satu)</label>
        <div>
            <label><input type="checkbox" name="hobi" value="coding"> Coding / Pemrograman</label>
            <label><input type="checkbox" name="hobi" value="desain"> Desain Grafis</label>
            <label><input type="checkbox" name="hobi" value="jaringan"> Jaringan Komputer</label>
            <label><input type="checkbox" name="hobi" value="gaming"> Gaming</label>
            <label><input type="checkbox" name="hobi" value="konten"> Membuat Konten</label>
        </div>

        <!-- ===== UPLOAD FOTO ===== -->
        <h2>D. Dokumen</h2>

        <label for="foto">Foto (jpg/png, maks. 2MB):</label>
        <input type="file" id="foto" name="foto" accept="image/jpeg,image/png">

        <!-- ===== SANDI ===== -->
        <h2>E. Buat Akun</h2>

        <label for="sandi">Kata Sandi: *</label>
        <input type="password" id="sandi" name="sandi"
               placeholder="Minimal 8 karakter"
               required minlength="8">

        <label for="konfSandi">Konfirmasi Kata Sandi: *</label>
        <input type="password" id="konfSandi" name="konf_sandi"
               placeholder="Ketik ulang kata sandi" required>

        <!-- ===== PERSETUJUAN ===== -->
        <br>
        <label>
            <input type="checkbox" name="setuju" required>
            Saya menyatakan bahwa data yang saya isi adalah benar dan dapat dipertanggungjawabkan.
        </label>

        <!-- ===== TOMBOL ===== -->
        <br>
        <button type="submit">Kirim Pendaftaran</button>
        <button type="reset" style="background:#e74c3c; margin-left:10px">Reset Formulir</button>

    </form>

    <br>
    <p><a href="index.html">← Kembali ke Profil</a></p>

</body>
</html>
